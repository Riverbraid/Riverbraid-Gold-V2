name: Riverbraid Verification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.0'

      - name: Install locked dependencies with lifecycle scripts denied
        run: npm ci --ignore-scripts

      - name: Execute local repository verifier
        run: npm run verify

      - name: Verify optional workspace dependency boundary
        run: npm run verify:workspace-boundary

      - name: Build local demo surface
        run: npm run build
